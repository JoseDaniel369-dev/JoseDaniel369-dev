<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jose Daniel García León</title>
    <meta
      name="description"
      content="Desarrollador full-stack. React Native, TypeScript y Node.js. Apps gratuitas y offline-first."
    />
    <meta name="theme-color" content="#EEF2F6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica tema y modo avión antes de pintar para evitar parpadeos.
      try {
        var q = new URLSearchParams(location.search)
        var t = q.get('theme')
        if (t !== 'light' && t !== 'dark') t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.offline = q.get('offline') === '1' ? 'true' : 'false'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
