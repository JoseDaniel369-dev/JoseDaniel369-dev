name: Deploy portfolio

# Publica la web en GitHub Pages cada vez que subes cambios a main.
# El dominio se configura en el repo: Settings > Pages > Custom domain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # BASE: el repo se llama JoseDaniel369-dev, así que Pages lo sirve en /JoseDaniel369-dev/.
      # SITE_URL activa canonical, Open Graph con URL absoluta, sitemap.xml y la URL en los datos estructurados.
      # Cuando compres josedanielgarcia.dev: pon BASE: / y SITE_URL: https://josedanielgarcia.dev
      # `npm run build` ya prerenderiza las dos páginas (/ y /en/).
      - run: npm run build
        env:
          BASE: /JoseDaniel369-dev/
          SITE_URL: https://josedaniel369-dev.github.io/JoseDaniel369-dev
          # Clave pública de web3forms.com (Settings > Secrets and variables > Actions > Variables > WEB3FORMS_KEY).
          # Sin ella el formulario de contacto cae a mailto:.
          VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
