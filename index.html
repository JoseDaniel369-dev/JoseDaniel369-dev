    <script>
      // Aplica tema y modo avión antes de pintar para evitar parpadeos.
      try {
        var q = new URLSearchParams(location.search)
        var t = q.get('theme')
        if (t !== 'light' && t !== 'dark') t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#0B1220' : '#EEF2F6')
        document.documentElement.dataset.offline = q.get('offline') === '1' ? 'true' : 'false'
      } catch (e) {}
    </script>
